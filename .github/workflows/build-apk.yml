name: Build NovaVance Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Organize Assets & Build Android APK
        run: |
          mkdir -p css js
          cp -f style.css player.css css/ 2>/dev/null || true
          cp -f app.js player.js api.js storage.js gesture.js js/ 2>/dev/null || true
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "NovaVance" "com.novavance.app" --web-dir "."
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaVance-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
